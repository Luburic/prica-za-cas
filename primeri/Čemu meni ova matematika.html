<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Nevidljivi kostur grada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Interaktivna priča za 6. razred: kako inženjeri koriste matematiku iz 5. i 6. razreda.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Lexend:wght@300..700&display=swap">
<style>
/* Raspored: scena preko celog ekrana (jedan neprekinut grad u preseku), prozor sa strane
   (na telefonu odozdo), ispod tanka traka. Zlatno = matematika, tirkizno = ti i tvoji potezi. */
:root {
  --font-display: "Bricolage Grotesque", "Lexend", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-body: "Lexend", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  /* stalna značenja */
  --math: #a86f00;          /* zlatna: matematika (tekst na svetloj podlozi) */
  --math-l: #e29c00;        /* zlatna linija u svetu */
  --math-g: rgba(255, 186, 30, .38);
  --math-soft: #fff1cc;
  --you: #067d84;           /* tirkizna: ti i tvoji potezi */
  --you-l: #0fb3bb;
  --you-g: rgba(18, 200, 205, .35);
  --you-ink: #ffffff;
  --force: #d24c3c;

  /* prozor i traka */
  --bg: #d8ecf8;
  --ink: #1a2436;
  --ink2: #3f4d63;
  --muted: #5b6980;
  --paper: #f8fafc;
  --paper2: #edf2f8;
  --line: #d7dfea;
  --barbg: rgba(248, 250, 252, .94);
  --shadow: rgba(16, 28, 52, .28);

  /* film za pogled izbliza (uvek taman, kao rendgenski snimak) */
  --film0: #06142e;
  --film1: #0e2a56;
  --fgrid: rgba(130, 175, 255, .13);
  --fink: #d9e6ff;
  --fdim: #8aa1cb;
  --fgold: #ffc94a;
  --fcyan: #4fe6df;
  --fcoral: #ff8370;

  /* svet danju */
  --sky0: #0a1838; --sky1: #3c84c6; --sky2: #8cc3ea; --sky3: #d9f0fb;
  --sun-op: 1; --moon-op: 0; --star-op: 0; --roomglow: 0; --cloud-op: .92; --lamp-glow: .28;
  --far1: #b2cee2; --far2: #9dbfd8; --far3: #c4dbea;
  --mid: #c5d6e5; --mid2: #b4c8db; --midwin: #e2edf6;
  --cloud: #ffffff;
  --grass: #79b268; --grass2: #5d9a56;
  --soil: #caa57c; --soil2: #b68c63; --soil3: #98724e;
  --under: #ddd8cf; --under2: #c8c1b6; --under3: #b3ab9f;
  --road: #5b636f; --road2: #4b525d; --curb: #d2d6db; --stripe: #f4f0e3; --walk: #dcd8d0;
  --water: #4f98cf; --water2: #2f72a8; --waterhi: #c4e5f8;
  --wall: #eedbc1; --wall2: #dec39f; --in: #f8eedf; --in2: #efdfc8; --slab: #b9a181; --sec: #8a7258;
  --win: #cde8f8; --win2: #a9d3ef; --frame: #ffffff;
  --furn: #c6ae8d; --furn2: #a48b6a; --bed: #8fb0d6; --bed2: #e4ebf4; --wood: #b98858; --screen: #23324a;
  --school: #e5ecf3; --school2: #cbd7e4; --school3: #7a93b0; --board: #3f6b52;
  --steel: #929fb0; --steel2: #6d7a8c; --cable: #8f9cad; --pylon: #dfe5ec; --pylon2: #b9c3cf;
  --truck: #f4f6f8; --truck2: #3b6caf; --tire: #2c3037;
  --tree: #62a25c; --tree2: #4b8a4e; --tree3: #84bc6e; --trunk: #86603f;
  --lamp: #e3e7ec; --lampon: #ffeaa6;
  --plane: #f4f6f9; --plane2: #bcc6d2;
  --sat: #d9dfe8; --satp: #2e5ea6;
  --wline: rgba(40, 52, 74, .30);
  --car: #d0675a; --car2: #6b8fb8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --math: #ffcc55; --math-l: #ffc23a; --math-g: rgba(255, 196, 50, .45); --math-soft: #3a2e10;
    --you: #45e3dc; --you-l: #45e3dc; --you-g: rgba(69, 227, 220, .42); --you-ink: #062a2c;
    --force: #ff7a68;
    --bg: #0a1428; --ink: #e7eef8; --ink2: #bac6d9; --muted: #95a5bf;
    --paper: #0f1a2e; --paper2: #172540; --line: #273856; --barbg: rgba(9, 17, 33, .92); --shadow: rgba(0, 0, 0, .55);
    --sky0: #02050d; --sky1: #061127; --sky2: #0d2045; --sky3: #1c335c;
    --sun-op: 0; --moon-op: 1; --star-op: 1; --roomglow: .55; --cloud-op: .32; --lamp-glow: .75;
    --far1: #142641; --far2: #1a2f51; --far3: #10203a;
    --mid: #17284a; --mid2: #13223f; --midwin: #f1c56a;
    --cloud: #42557a;
    --grass: #2b573b; --grass2: #214631;
    --soil: #4b3b2f; --soil2: #3e3127; --soil3: #31271f;
    --under: #3b3d47; --under2: #31333c; --under3: #282a31;
    --road: #262b33; --road2: #1e2229; --curb: #4b515b; --stripe: #b9b4a2; --walk: #393c44;
    --water: #173b62; --water2: #0f2b4b; --waterhi: #5684b5;
    --wall: #474356; --wall2: #3a3648; --in: #5d4c43; --in2: #4d4039; --slab: #2e2a36; --sec: #24212b;
    --win: #ffd57c; --win2: #efb75a; --frame: #6a6378;
    --furn: #7d6852; --furn2: #614f3e; --bed: #4a628b; --bed2: #8e9ab0; --wood: #6f5339; --screen: #0c1424;
    --school: #3b4660; --school2: #2e384e; --school3: #8ba2c3; --board: #2a4a3a;
    --steel: #5a667b; --steel2: #475265; --cable: #7d8ba2; --pylon: #6d7a93; --pylon2: #57627b;
    --truck: #8e97a7; --truck2: #2e5995; --tire: #101217;
    --tree: #234c37; --tree2: #1b3e2e; --tree3: #2e5b41; --trunk: #3e2e22;
    --lamp: #8a93a3; --lampon: #ffe08a;
    --plane: #c6cedb; --plane2: #8892a7;
    --sat: #aeb8c8; --satp: #26528f;
    --wline: rgba(0, 0, 0, .45);
    --car: #8a4a44; --car2: #3f5f86;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --math: #ffcc55; --math-l: #ffc23a; --math-g: rgba(255, 196, 50, .45); --math-soft: #3a2e10;
  --you: #45e3dc; --you-l: #45e3dc; --you-g: rgba(69, 227, 220, .42); --you-ink: #062a2c;
  --force: #ff7a68;
  --bg: #0a1428; --ink: #e7eef8; --ink2: #bac6d9; --muted: #95a5bf;
  --paper: #0f1a2e; --paper2: #172540; --line: #273856; --barbg: rgba(9, 17, 33, .92); --shadow: rgba(0, 0, 0, .55);
  --sky0: #02050d; --sky1: #061127; --sky2: #0d2045; --sky3: #1c335c;
  --sun-op: 0; --moon-op: 1; --star-op: 1; --roomglow: .55; --cloud-op: .32; --lamp-glow: .75;
  --far1: #142641; --far2: #1a2f51; --far3: #10203a;
  --mid: #17284a; --mid2: #13223f; --midwin: #f1c56a;
  --cloud: #42557a;
  --grass: #2b573b; --grass2: #214631;
  --soil: #4b3b2f; --soil2: #3e3127; --soil3: #31271f;
  --under: #3b3d47; --under2: #31333c; --under3: #282a31;
  --road: #262b33; --road2: #1e2229; --curb: #4b515b; --stripe: #b9b4a2; --walk: #393c44;
  --water: #173b62; --water2: #0f2b4b; --waterhi: #5684b5;
  --wall: #474356; --wall2: #3a3648; --in: #5d4c43; --in2: #4d4039; --slab: #2e2a36; --sec: #24212b;
  --win: #ffd57c; --win2: #efb75a; --frame: #6a6378;
  --furn: #7d6852; --furn2: #614f3e; --bed: #4a628b; --bed2: #8e9ab0; --wood: #6f5339; --screen: #0c1424;
  --school: #3b4660; --school2: #2e384e; --school3: #8ba2c3; --board: #2a4a3a;
  --steel: #5a667b; --steel2: #475265; --cable: #7d8ba2; --pylon: #6d7a93; --pylon2: #57627b;
  --truck: #8e97a7; --truck2: #2e5995; --tire: #101217;
  --tree: #234c37; --tree2: #1b3e2e; --tree3: #2e5b41; --trunk: #3e2e22;
  --lamp: #8a93a3; --lampon: #ffe08a;
  --plane: #c6cedb; --plane2: #8892a7;
  --sat: #aeb8c8; --satp: #26528f;
  --wline: rgba(0, 0, 0, .45);
  --car: #8a4a44; --car2: #3f5f86;
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: border-box; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 20px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--you-l); outline-offset: 3px; }

#app { position: relative; height: 100%; display: flex; flex-direction: column; }
#stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; background: var(--sky3); }
#world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
#overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

/* ---------- svet: boje po ulogama ---------- */
.f-far1 { fill: var(--far1); } .f-far2 { fill: var(--far2); } .f-far3 { fill: var(--far3); }
.f-mid { fill: var(--mid); } .f-mid2 { fill: var(--mid2); } .f-midwin { fill: var(--midwin); }
.f-cloud { fill: var(--cloud); opacity: var(--cloud-op); }
.f-grass { fill: var(--grass); } .f-grass2 { fill: var(--grass2); }
.f-soil { fill: var(--soil); } .f-soil2 { fill: var(--soil2); } .f-soil3 { fill: var(--soil3); }
.f-under { fill: var(--under); } .f-under2 { fill: var(--under2); } .f-under3 { fill: var(--under3); }
.f-road { fill: var(--road); } .f-road2 { fill: var(--road2); } .f-curb { fill: var(--curb); } .f-stripe { fill: var(--stripe); } .f-walk { fill: var(--walk); }
.f-water { fill: var(--water); } .f-water2 { fill: var(--water2); } .s-waterhi { stroke: var(--waterhi); fill: none; }
.f-wall { fill: var(--wall); } .f-wall2 { fill: var(--wall2); } .f-in { fill: var(--in); } .f-in2 { fill: var(--in2); }
.f-slab { fill: var(--slab); } .f-sec { fill: var(--sec); }
.f-win { fill: var(--win); } .f-win2 { fill: var(--win2); } .f-frame { fill: var(--frame); }
.f-furn { fill: var(--furn); } .f-furn2 { fill: var(--furn2); } .f-bed { fill: var(--bed); } .f-bed2 { fill: var(--bed2); } .f-wood { fill: var(--wood); } .f-screen { fill: var(--screen); }
.f-school { fill: var(--school); } .f-school2 { fill: var(--school2); } .f-school3 { fill: var(--school3); } .f-board { fill: var(--board); }
.f-steel { fill: var(--steel); } .f-steel2 { fill: var(--steel2); } .s-cable { stroke: var(--cable); fill: none; }
.f-pylon { fill: var(--pylon); } .f-pylon2 { fill: var(--pylon2); }
.f-truck { fill: var(--truck); } .f-truck2 { fill: var(--truck2); } .f-tire { fill: var(--tire); }
.f-tree { fill: var(--tree); } .f-tree2 { fill: var(--tree2); } .f-tree3 { fill: var(--tree3); } .f-trunk { fill: var(--trunk); }
.f-lamp { fill: var(--lamp); } .f-lampon { fill: var(--lampon); }
.f-plane { fill: var(--plane); } .f-plane2 { fill: var(--plane2); }
.f-sat { fill: var(--sat); } .f-satp { fill: var(--satp); }
.f-car { fill: var(--car); } .f-car2 { fill: var(--car2); }
.s-line { stroke: var(--wline); fill: none; }
.f-line { fill: var(--wline); }
.sun { opacity: var(--sun-op); } .moon { opacity: var(--moon-op); } .stars-night { opacity: var(--star-op); }
.roomglow { opacity: var(--roomglow); }
.lampglow { opacity: var(--lamp-glow); }

/* rendgenski kostur u svetu: zlatno */
.xr { pointer-events: none; }
.xg { stroke: var(--math-g); stroke-width: 10px; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.xl { stroke: var(--math-l); stroke-width: 2.6px; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.xf { fill: var(--math-l); }
.xfg { fill: var(--math-g); }
.xt { fill: var(--math-l); font-family: var(--font-display); font-weight: 700; paint-order: stroke; stroke: var(--bg); stroke-linejoin: round; }
.you-core { fill: var(--you-l); }
.you-halo { fill: var(--you-g); }
.you-ring { stroke: var(--you-l); fill: none; }
.trail { stroke: var(--you-l); fill: none; stroke-width: 3px; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 10; }

/* ---------- merač ---------- */
#meter {
  position: absolute; z-index: 5;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  padding: 10px 14px 10px; border-radius: 14px;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  box-shadow: 0 8px 24px -14px var(--shadow), 0 0 0 1px var(--line);
  min-width: 200px; pointer-events: none;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.m-lab { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.m-bar { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; margin: 7px 0 6px; }
.m-bar i { height: 9px; border-radius: 3px; background: var(--paper2); box-shadow: inset 0 0 0 1px var(--line); transition: background .6s, box-shadow .6s; }
.m-bar i.on { background: var(--math-l); box-shadow: 0 0 10px var(--math-g); }
.m-val { font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--math); font-variant-numeric: tabular-nums; line-height: 1.2; }
.m-val small { font-family: var(--font-body); font-weight: 400; font-size: 14px; color: var(--muted); margin-left: 4px; }

/* ---------- dugme na mestu radnje ---------- */
.hot {
  position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
  border: 0; max-width: min(78vw, 380px);
  padding: 11px 20px 12px; border-radius: 999px;
  background: var(--you); color: var(--you-ink);
  font-family: var(--font-body); font-weight: 600; font-size: 19px; line-height: 1.25; text-align: center;
  box-shadow: 0 10px 28px -10px var(--shadow), 0 0 0 4px color-mix(in srgb, var(--you-l) 30%, transparent);
  transform: translate(-9999px, -9999px);
  opacity: 0; transition: opacity .5s;
}
.hot.show { opacity: 1; animation: hotglow 2.6s ease-in-out infinite; }
.hot:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
.hotpin, .hotstem { position: absolute; left: 0; top: 0; pointer-events: none; opacity: 0; transition: opacity .5s; transform: translate(-9999px, -9999px); }
.hotpin.show, .hotstem.show { opacity: 1; }
.hotpin { width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--you-l); box-shadow: 0 0 0 3px color-mix(in srgb, var(--paper) 80%, transparent); }
.hotpin::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid var(--you-l); animation: ping 2.6s ease-out infinite; }
.hotstem { width: 2px; background: var(--you-l); }
@keyframes hotglow { 0%, 100% { box-shadow: 0 10px 28px -10px var(--shadow), 0 0 0 4px color-mix(in srgb, var(--you-l) 26%, transparent); } 50% { box-shadow: 0 10px 28px -10px var(--shadow), 0 0 0 10px color-mix(in srgb, var(--you-l) 14%, transparent); } }
@keyframes ping { 0% { transform: scale(.5); opacity: .9; } 80%, 100% { transform: scale(1.6); opacity: 0; } }

.chip {
  position: absolute; left: 0; top: 0; transform: translate(-9999px, -9999px);
  padding: 3px 10px 4px; border-radius: 999px; white-space: nowrap;
  font-size: 13px; font-weight: 600; letter-spacing: .01em;
  color: var(--math); background: color-mix(in srgb, var(--paper) 90%, transparent);
  box-shadow: 0 0 0 1.5px var(--math-l), 0 4px 14px -6px var(--shadow);
  opacity: 0; transition: opacity .6s;
}
.chip.show { opacity: 1; }
.phase-lab {
  position: absolute; left: 0; top: 0; transform: translate(-9999px, -9999px);
  font-family: var(--font-display); font-weight: 700; font-size: clamp(18px, 2.4vw, 30px);
  color: var(--ink); letter-spacing: -.01em; white-space: nowrap;
  padding: 4px 14px 6px; border-radius: 12px;
  background: color-mix(in srgb, var(--paper) 84%, transparent);
  box-shadow: 0 6px 20px -12px var(--shadow);
  opacity: 0; transition: opacity .6s;
}
.phase-lab.show { opacity: 1; }
.phase-lab small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 13px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }

/* ---------- prozor ---------- */
#panel {
  position: absolute; z-index: 6;
  top: calc(16px + env(safe-area-inset-top, 0px)); bottom: 16px;
  right: max(16px, env(safe-area-inset-right, 0px));
  width: var(--pw, 460px);
  display: flex; flex-direction: column;
  background: var(--paper); color: var(--ink);
  border-radius: 22px;
  box-shadow: 0 24px 60px -24px var(--shadow), 0 0 0 1px var(--line);
  transform: translateX(calc(100% + 48px)); visibility: hidden;
  transition: transform .55s cubic-bezier(.2, .8, .2, 1), visibility 0s linear .55s;
}
#panel.open { transform: none; visibility: visible; transition: transform .55s cubic-bezier(.2, .8, .2, 1), visibility 0s; }
.sheet #panel {
  top: auto; left: 0; right: 0; bottom: 0; width: auto; height: var(--sh, 58%);
  border-radius: 22px 22px 0 0; transform: translateY(105%);
}
.sheet #panel.open { transform: none; }
.p-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 18px 24px 0; }
.sheet .p-head { padding: 14px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tag { font-size: 13px; font-weight: 600; color: var(--math); padding: 2px 10px 3px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--math-l); }
.tag:empty { display: none; }
.p-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px 24px 8px; overscroll-behavior: contain; }
.sheet .p-body { padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); }
.p-body:focus { outline: none; }
.p-title { font-family: var(--font-display); font-weight: 750; font-size: 30px; line-height: 1.12; letter-spacing: -.015em; margin: 6px 0 12px; text-wrap: balance; }
.p-text p { margin: 0 0 12px; max-width: 34em; }
.p-text strong { font-weight: 700; color: var(--ink); background: linear-gradient(transparent 62%, color-mix(in srgb, var(--math-l) 34%, transparent) 62%); padding: 0 1px; }
.sw { display: inline-block; width: .7em; height: .7em; border-radius: 50%; margin: 0 .3em 0 .1em; vertical-align: .02em; }
.sw-math { background: var(--math-l); box-shadow: 0 0 0 3px var(--math-g); }
.sw-you { background: var(--you-l); box-shadow: 0 0 0 3px var(--you-g); }
.p-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 24px 20px; border-top: 1px solid var(--line); }
.sheet .p-foot { padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.btn { border: 0; cursor: pointer; border-radius: 999px; font-weight: 600; }
.btn.ghost { background: none; color: var(--muted); padding: 10px 12px; font-size: 17px; }
.btn.ghost:hover { color: var(--ink); }
.btn.go {
  margin-left: auto; padding: 12px 26px 13px; font-size: 19px;
  background: var(--paper2); color: var(--ink2);
  box-shadow: inset 0 0 0 1.5px var(--line);
  transition: background .4s, color .4s, box-shadow .4s;
}
.btn.go.ready { background: var(--you); color: var(--you-ink); box-shadow: 0 0 0 0 var(--you-g); animation: goglow 2.2s ease-in-out infinite; }
@keyframes goglow { 0%, 100% { box-shadow: 0 0 0 0 var(--you-g), 0 8px 20px -10px var(--shadow); } 50% { box-shadow: 0 0 0 9px transparent, 0 0 22px 2px var(--you-g); } }
.btn.go .arr { display: inline-block; margin-left: .35em; }

/* pogled izbliza */
.cu { display: flex; flex-direction: column; gap: 10px; }
.film {
  position: relative; width: 100%; border-radius: 16px; overflow: hidden;
  background: radial-gradient(120% 90% at 30% 20%, var(--film1), var(--film0));
  box-shadow: inset 0 0 0 1px rgba(150, 190, 255, .18), 0 10px 30px -18px var(--shadow);
}
.film svg { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
.film .ftag { position: absolute; top: 8px; right: 12px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--fdim); font-weight: 600; pointer-events: none; }
.cu-cap { margin: 2px 0 0; font-size: 19px; line-height: 1.45; }
.cu-prompt { margin: 0; font-size: 19px; line-height: 1.45; font-weight: 600; color: var(--you); min-height: 1.45em; }
.cu-prompt.ok { color: var(--math); }
.cu-prompt.hint { color: var(--ink2); font-weight: 500; }
.cu-ctl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; min-height: 0; }
.cu-ctl:empty { display: none; }
.cu-ctl .opt {
  border: 0; cursor: pointer; border-radius: 12px; min-width: 64px; padding: 10px 16px 11px;
  font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums;
  background: color-mix(in srgb, var(--you-l) 14%, var(--paper)); color: var(--you);
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--you-l) 55%, transparent);
}
.cu-ctl .opt:hover { background: color-mix(in srgb, var(--you-l) 24%, var(--paper)); }
.cu-ctl .opt.wrong { opacity: .55; box-shadow: inset 0 0 0 2px var(--line); color: var(--muted); background: var(--paper2); }
.cu-ctl .opt.right { background: var(--math-l); color: #2a1d00; box-shadow: 0 0 14px var(--math-g); }
.cu-ctl .opt:disabled { cursor: default; }
.cu-ctl label.rng { display: flex; align-items: center; gap: 12px; width: 100%; font-size: 16px; color: var(--muted); }
.cu-ctl label.rng span { white-space: nowrap; }
input[type="range"].r {
  -webkit-appearance: none; appearance: none; flex: 1 1 auto; min-width: 0; height: 36px; background: none; cursor: pointer;
}
input[type="range"].r::-webkit-slider-runnable-track { height: 8px; border-radius: 6px; background: color-mix(in srgb, var(--you-l) 26%, var(--paper2)); }
input[type="range"].r::-moz-range-track { height: 8px; border-radius: 6px; background: color-mix(in srgb, var(--you-l) 26%, var(--paper2)); }
input[type="range"].r::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -10px; border-radius: 50%; background: var(--you-l); border: 3px solid var(--paper); box-shadow: 0 0 0 2px var(--you-l), 0 4px 10px -2px var(--shadow); }
input[type="range"].r::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--you-l); border: 3px solid var(--paper); box-shadow: 0 0 0 2px var(--you-l); }
.cu-ctl .pad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 46px); gap: 6px; }
.cu-ctl .pad .opt { min-width: 0; padding: 0; font-size: 22px; }
.cu-ctl .pad .up { grid-column: 2; grid-row: 1; } .cu-ctl .pad .lf { grid-column: 1; grid-row: 2; } .cu-ctl .pad .dn { grid-column: 2; grid-row: 2; } .cu-ctl .pad .rt { grid-column: 3; grid-row: 2; }
.cu-ctl .readout { font-family: var(--font-display); font-weight: 700; font-size: 24px; color: var(--you); font-variant-numeric: tabular-nums; margin-left: 6px; }

/* ---------- traka ---------- */
#bar {
  position: relative; z-index: 8; flex: 0 0 auto;
  display: flex; align-items: center; gap: 12px;
  height: 50px; padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--barbg); border-top: 1px solid var(--line);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.dots { display: flex; align-items: center; gap: 14px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.dots::-webkit-scrollbar { display: none; }
.dgroup { display: flex; align-items: center; gap: 2px; }
.dgroup .gname { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 4px; white-space: nowrap; }
.dot { position: relative; width: 24px; height: 30px; border: 0; padding: 0; background: none; cursor: pointer; flex: 0 0 auto; }
.dot::before { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--paper2); box-shadow: inset 0 0 0 1.5px var(--muted); transition: transform .3s, background .3s, box-shadow .3s; }
.dot.done::before { background: var(--math-l); box-shadow: 0 0 6px var(--math-g); }
.dot.cur::before { transform: scale(1.45); background: var(--you-l); box-shadow: 0 0 0 3px var(--you-g); }
.dot:hover::before { transform: scale(1.3); }
.tools { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
.tool { display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; cursor: pointer; color: var(--ink2); padding: 7px 10px; border-radius: 10px; font-size: 15px; font-weight: 500; white-space: nowrap; }
.tool:hover { background: var(--paper2); color: var(--ink); }
.tool svg { width: 20px; height: 20px; flex: 0 0 auto; }
.tool[aria-pressed="false"] .wave { display: none; }
.tool[aria-pressed="true"] .xmark { display: none; }
.tool[aria-expanded="true"] { background: var(--paper2); color: var(--ink); }
@media (max-width: 1020px) { .dgroup .gname { display: none; } .dgroup { gap: 0; } .dots { gap: 6px; } }
@media (max-width: 760px) { .tool .tl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } .tool { padding: 8px; } .dot { width: 18px; } #bar { gap: 6px; } }

/* ---------- mali rečnik ---------- */
#gloss {
  position: absolute; z-index: 9; bottom: calc(100% + 10px);
  right: max(16px, env(safe-area-inset-right, 0px));
  width: min(560px, calc(100vw - 32px)); max-height: min(70vh, 640px); overflow-y: auto;
  background: var(--paper); color: var(--ink); border-radius: 18px;
  box-shadow: 0 24px 60px -20px var(--shadow), 0 0 0 1px var(--line);
  padding: 18px 22px 20px; font-size: 17px; line-height: 1.45;
}
#gloss h2 { font-family: var(--font-display); font-size: 24px; margin: 0 0 4px; letter-spacing: -.01em; }
#gloss h3 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
#gloss dl { margin: 0; display: grid; grid-template-columns: 1fr; gap: 8px; }
#gloss dt { font-weight: 700; color: var(--math); }
#gloss dt .st { font-weight: 500; color: var(--muted); font-size: 13px; margin-left: 6px; }
#gloss dd { margin: 0 0 4px; }
#gloss ul { margin: 0; padding-left: 1.1em; }
#gloss li { margin-bottom: 6px; }
#gloss a { color: var(--you); word-break: break-word; }
#gloss .lead { color: var(--muted); margin: 0 0 6px; font-size: 15px; }
#gloss .gx { position: absolute; top: 10px; right: 10px; }

.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 560px) {
  body { font-size: 18px; }
  .p-title { font-size: 25px; margin: 4px 0 8px; }
  .p-text p { margin-bottom: 9px; }
  .cu-cap, .cu-prompt { font-size: 17px; }
  #meter { min-width: 0; padding: 7px 10px; }
  .m-lab { font-size: 11px; }
  .m-val { font-size: 17px; }
  .m-bar i { height: 7px; }
  .hot { font-size: 17px; padding: 9px 15px 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .hot.show, .hotpin::after, .btn.go.ready { animation: none; }
  #panel, #panel.open { transition: none; }
}

/* ---------- film: boje u pogledu izbliza ---------- */
.film .ft { font-family: var(--font-body); font-weight: 600; }
.film .ft.big { font-family: var(--font-display); font-weight: 750; }
.film .ft.mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-weight: 500; letter-spacing: .5px; }
.film .g-l { stroke: var(--fgold); fill: none; }
.film .g-f { fill: var(--fgold); }
.film .g-fa { fill: rgba(255, 201, 74, .2); }
.film .g-fa2 { fill: rgba(255, 201, 74, .55); }
.film .c-l { stroke: var(--fcyan); fill: none; }
.film .c-f { fill: var(--fcyan); }
.film .i-l { stroke: var(--fink); fill: none; }
.film .i-f { fill: var(--fink); }
.film .i-f2 { fill: #5f7cb2; }
.film .d-l { stroke: var(--fdim); fill: none; }
.film .d-f { fill: var(--fdim); }
.film .r-l { stroke: var(--fcoral); fill: none; }
.film .r-f { fill: var(--fcoral); }
.film .w-l { stroke: #ffffff; fill: none; }
.film .w-f { fill: #ffffff; }
.film .k-l { stroke: var(--fgrid); fill: none; }
.film .robot { fill: #2b4677; stroke: var(--fink); stroke-width: 3; }
.film .robot2 { fill: #36578f; }
.film .under { fill: rgba(170, 125, 80, .16); }
.film .cab { fill: #ffe7a6; }
.film .sp { fill: #3a6fc2; }
.film .lampg { fill: rgba(255, 226, 140, .5); }
.film .arm { stroke: #86a2d6; }
.film .bar { stroke: #a5bbe2; }
.film .plane { fill: #c9d6ee; stroke: #eef3ff; stroke-width: 1.5; }
.film .roof { fill: rgba(150, 175, 220, .14); }
.film .panel { fill: #2f5fb0; stroke: #8db3f0; stroke-width: 1; }
.film .chip-off { fill: rgba(255, 255, 255, .06); stroke: var(--fdim); stroke-width: 1.5; }
.film .chip-on { fill: rgba(255, 201, 74, .18); stroke: var(--fgold); stroke-width: 2; }
.film .star { fill: #fff3b8; }
.film .eye { fill: #06303a; }
.film [role="button"]:focus-visible { outline: none; }
.film [role="button"]:focus-visible > * { stroke: #ffffff; stroke-width: 3px; }
#you .you-halo { transform-box: fill-box; transform-origin: center; animation: halo 2.6s ease-in-out infinite; }
@keyframes halo { 0%, 100% { transform: scale(.8); opacity: .9; } 50% { transform: scale(1.25); opacity: .45; } }
@media (prefers-reduced-motion: reduce) { #you .you-halo { animation: none; } }

/* telefon: kompaktniji pogled izbliza i oznake faza */
.sheet.cu-on .p-title { font-size: 21px; margin: 2px 0 6px; }
.sheet.cu-on .cu { gap: 7px; }
.sheet.cu-on .cu-cap, .sheet.cu-on .cu-prompt { font-size: 16px; line-height: 1.4; }
.sheet.cu-on .p-foot { padding-top: 7px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
.sheet.cu-on .btn.go { padding: 9px 22px 10px; font-size: 17px; }
.sheet.cu-on .cu-ctl .opt { padding: 8px 14px 9px; font-size: 17px; min-width: 52px; }
.sheet.cu-on .cu-ctl .pad { grid-template-rows: repeat(2, 40px); }
@media (max-width: 560px) {
  .phase-lab { font-size: 15px; padding: 2px 8px 3px; border-radius: 8px; }
  .phase-lab small { display: none; }
  .chip { font-size: 11px; padding: 2px 7px 3px; }
}

/* niski ekrani (telefon položen) */
@media (max-height: 520px) {
  body { font-size: 16px; }
  #panel { top: calc(8px + env(safe-area-inset-top, 0px)); bottom: 8px; }
  .p-head { padding: 10px 16px 0; }
  .p-body { padding: 4px 16px 6px; }
  .p-title { font-size: 21px; margin: 2px 0 6px; }
  .p-text p { margin-bottom: 7px; }
  .p-foot { padding: 6px 16px 8px; }
  .btn.go { padding: 8px 20px 9px; font-size: 16px; }
  .btn.ghost { font-size: 15px; padding: 6px 8px; }
  .cu { gap: 6px; }
  .cu-cap, .cu-prompt { font-size: 15px; line-height: 1.35; }
  .film svg { width: auto; height: 46vh; max-width: 100%; margin: 0 auto; aspect-ratio: 480 / 300; }
  .cu-ctl .opt { padding: 6px 12px 7px; font-size: 16px; }
  .cu-ctl .pad { grid-template-rows: repeat(2, 36px); grid-template-columns: repeat(3, 44px); }
  #meter { padding: 6px 10px; min-width: 0; }
  .m-lab { font-size: 10px; } .m-val { font-size: 15px; } .m-bar { margin: 4px 0 3px; } .m-bar i { height: 6px; }
  .hot { font-size: 15px; padding: 7px 14px 8px; }
  #bar { height: 44px; }
}

/* veliki ekran ili projektor */
@media (min-width: 1700px) and (min-height: 900px) {
  body { font-size: 24px; }
  .p-head { padding: 24px 30px 0; }
  .p-body { padding: 10px 30px 10px; }
  .p-foot { padding: 14px 30px 24px; }
  .eyebrow, .tag { font-size: 15px; }
  .p-title { font-size: 38px; margin: 8px 0 16px; }
  .cu-cap, .cu-prompt { font-size: 22px; }
  .btn.go { font-size: 22px; padding: 14px 32px 15px; }
  .btn.ghost { font-size: 19px; }
  .cu-ctl .opt { font-size: 22px; padding: 12px 20px 13px; }
  .cu-ctl .readout { font-size: 28px; }
  .cu-ctl label.rng { font-size: 18px; }
  #meter { padding: 14px 18px; min-width: 250px; }
  .m-lab { font-size: 15px; } .m-val { font-size: 26px; } .m-bar i { height: 11px; }
  .hot { font-size: 23px; padding: 13px 24px 14px; max-width: 460px; }
  .chip { font-size: 15px; }
  .phase-lab { font-size: 34px; }
  #bar { height: 58px; }
  .tool { font-size: 17px; }
  .dot { width: 28px; }
  #gloss { font-size: 19px; width: 640px; }
}

</style>
</head>
<body>
<div id="app">
  <main id="stage" aria-label="Grad u preseku">
    <svg id="world" aria-hidden="true" focusable="false"></svg>
    <div id="overlay"></div>
    <div id="meter" role="status" aria-live="polite">
      <div class="m-lab">Grad pod rendgenom</div>
      <div class="m-bar" id="mbar"></div>
      <div class="m-val" id="mval">0/10 = 0%</div>
    </div>
    <aside id="panel" aria-labelledby="ptitle">
      <div class="p-head"><span class="eyebrow" id="peye"></span><span class="tag" id="ptag"></span></div>
      <div class="p-body" id="pbody" tabindex="-1">
        <h2 class="p-title" id="ptitle"></h2>
        <div id="pcontent" class="p-text"></div>
      </div>
      <div class="p-foot">
        <button class="btn ghost" id="pback" type="button">Nazad</button>
        <button class="btn go" id="pnext" type="button">Dalje</button>
      </div>
    </aside>
  </main>
  <nav id="bar" aria-label="Tok priče">
    <div class="dots" id="dots"></div>
    <div class="tools">
      <button class="tool" id="tSound" type="button" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h3l5-4v14l-5-4H4z"/><path class="wave" d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/><path class="xmark" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
        <span class="tl">Zvuk</span>
      </button>
      <button class="tool" id="tRestart" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4 4.5v4.5h4.5"/></svg>
        <span class="tl">Ispočetka</span>
      </button>
      <button class="tool" id="tFull" type="button" aria-label="Ceo ekran">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <span class="tl">Ceo ekran</span>
      </button>
      <button class="tool" id="tGloss" type="button" aria-expanded="false" aria-controls="gloss">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9 7.5h6"/></svg>
        <span class="tl">Mali rečnik</span>
      </button>
    </div>
    <section id="gloss" hidden aria-label="Mali rečnik"></section>
  </nav>
</div>
<script>

<script>
/* Zvuk: sve se sintetizuje u pregledaču (Web Audio), bez fajlova. */
K.Audio = (() => {
  const KEY = 'kostur-zvuk';
  let on = true;
  try { on = localStorage.getItem(KEY) !== 'off'; } catch (e) { /* bez skladišta */ }

    [[53, 60, 64, 69], [50, 57, 62, 65], [46, 53, 57, 62], [48, 55, 60, 64]],   // kod kuće
    [[50, 57, 62, 66], [47, 54, 59, 62], [43, 55, 59, 62], [45, 52, 57, 61]],   // na putu
    [[48, 55, 59, 64], [50, 54, 57, 62], [45, 52, 57, 60], [43, 50, 55, 59]],   // u školi
    [[51, 58, 62, 67], [48, 55, 58, 63], [44, 51, 56, 60], [46, 53, 58, 62]]    // kraj
  ];
  const BELL = [[2, 3, 1, 3], [3, 2, 3, 1], [2, 3, 2, 1], [3, 1, 2, 3]];
  const CHORD = 7.5;
  const LV = { music: 0.45, amb: 1.0, sfx: 0.6, tone: 0.5, master: 0.9 };

  function noise(c, type, secs) {
    const n = Math.floor(c.sampleRate * secs), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);

    for (let i = 0; i < n; i++) {
      const w = Math.random() * 2 - 1;
      if (type === 'brown') { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; }
      else if (type === 'pink') { b0 = 0.997 * b0 + 0.029591 * w; b1 = 0.985 * b1 + 0.032534 * w; b2 = 0.95 * b2 + 0.048056 * w; d[i] = (b0 + b1 + b2 + w * 0.05) * 1.6; }

    river: { n: 'pink', type: 'bandpass', f: 900, q: 0.55, lv: 0.045, lfo: 0.13 },
    sky: { n: 'white', type: 'highpass', f: 1900, q: 0.4, lv: 0.022, lfo: 0.07 },
    school: { n: 'brown', type: 'lowpass', f: 420, q: 0.5, lv: 0.05, lfo: 0 }

      set(w, t, tc) {

      case 'tick': blip(c, dest, 1250, 1150, t, 0.05, 0.06); break;

    }

    for (const k of Object.keys(PLACES)) out['amb_' + k] = await render(8, (c, g) => { const a = ambient(c, g.amb); a.set({ [k]: 1 }, 0, 0.01); });

      sfx(c, g.sfx, 'ok', 3); sfx(c, g.sfx, 'xray', 6); meterTone(c, g.tone, 0.3, 0.4, 6.3);
    });
    out.mix_scene = await render(12, (c, g) => {
      const a = ambient(c, g.amb); a.set({ river: 1 }, 0, 0.01);
      for (let i = 0; i < 2; i++) chord(c, g.musicIn, 1, i, 0.1 + i * CHORD);
      sfx(c, g.sfx, 'hot', 4);
    });
    return out;
  };
  return API;
})();

    });
  }
  const reveal = (tok, i, dur) => { A.play('xray'); return tw(tok, dur || 900, p => W.setXR(i, p)); };
  function meterTo(k) { setMeter(k, true); doneK = k; placeOverlays(); }

  async function conseq(i, tok) {
    closePanel();
    const full = area(false);
    if (i !== 3) { if (!(await camTo(frame(ST[i].focus, full, capOf(i)), 800, tok))) return; }
    switch (i) {
      case 0:
        await reveal(tok, 0); meterTo(1);
        await sleep(tok, 700);
        await walk(PATHS[0], tok, zoomTo(1));
        break;
      case 1:
        A.play('xray');
        await tw(tok, 1600, p => { W.setXR(1, Math.min(1, p * 2)); W.setRobotArc(p); W.setRobot(p); });
        meterTo(2); await sleep(tok, 600);
        await walk(PATHS[1], tok, zoomTo(2));
        break;
      case 2: {
        await reveal(tok, 2); meterTo(3);
        await sleep(tok, 400);
        const z = clamp(full.h / 760, 0.35, 2);
        if (!(await camTo({ cx: 1080, cy: W.fl(3) - 60, z, ax: full.x + full.w / 2, ay: full.y + full.h / 2 }, 800, tok))) return;
        A.play('travel');
        if (!(await tw(tok, 2800, p => { const f = 3 - 4 * p; W.setCabin(f); const y = W.fl(f) - 20; setDotPos(1080, y); cam.cy = y - 40; applyCam(); }))) return;
        W.setCabin(-1);
        await walk(PATHS[2].slice(1), tok, zoomTo(3), x => { if (x >= 1260) W.setBike(false); });
        break;
      }
      case 3:
        if (!(await camTo(frame(SKYSHOT, full), null, tok))) return;
        W.setXR(3, 1); W.setGPS(0);
        for (let k = 0; k < 3; k++) { A.play('xray'); if (!(await tw(tok, 1000, p => W.setGPS((k + p) / 3)))) return; await sleep(tok, 250); }
        meterTo(4); await sleep(tok, 1100);
        await tw(tok, 900, p => W.setGPS(1, p));
        if (!(await camTo(frame(ST[3].focus, full, capOf(3)), null, tok))) return;
        await walk(PATHS[3], tok, zoomTo(4));
        break;
      case 4:
        A.play('xray'); W.setXR(4, 1);
        await tw(tok, 2600, p => W.setScissor(p));
        A.play('ok');
        await tw(tok, 700, p => W.setLampLevel(p));
        meterTo(5); await sleep(tok, 700);
        await walk(PATHS[4], tok, clamp(frame(ST[5].focus, full, capOf(5)).z, 0.35, 2.2));
        if (!(await camTo(frame(ST[5].focus, full, capOf(5)), 900, tok))) return;
        break;
      case 5:
        W.setXR(5, 1); A.play('xray');
        for (let n = 1; n <= 6; n++) { W.setTri(n); if (n > 1) A.play('tick'); if (!(await sleep(tok, 300))) return; }
        meterTo(6); await sleep(tok, 600);
        await walk(PATHS[5], tok, clamp(frame(ST[5].focus, full, capOf(5)).z * 1.4, 0.35, 2.2));
        break;
      case 6: {
        A.play('xray');
        await tw(tok, 900, p => W.setPlaneXR(p));
        meterTo(7); await sleep(tok, 600);
        const z0 = cam.z;
        A.play('travel');
        if (!(await tw(tok, 2400, p => { planePos = W.setPlane(p); cam.cx = planePos[0]; cam.cy = planePos[1]; cam.z = lerp(z0, z0 * 0.7, p); applyCam(); }))) return;
        await walk(PATHS[6], tok, clamp(frame(ST[5].focus, full, capOf(5)).z * 1.4, 0.35, 2.2));
        break;
      }
      case 7:
        await reveal(tok, 7, 1300); meterTo(8);
        await sleep(tok, 700);
        await walk(PATHS[7], tok, zoomTo(8));
        break;
      case 8:
        A.play('unlock');
        await tw(tok, 900, p => W.setXR(8, p));
        W.setScreen('game', 0);
        meterTo(9); await sleep(tok, 600);
        break;
      case 9:
        A.play('travel');
        await tw(tok, 1500, p => W.setScreen('game', p));
        await reveal(tok, 9, 700); meterTo(10);
        await sleep(tok, 700);
        break;
    }
  }
  async function outroSeq(tok) {
    const full = area(false);
    if (!(await camTo(frameOver(full), null, tok))) return;
    chipShown.fill(false); placeOverlays();
    W.setTrail(TRAIL, 0);
    let shown = 0;
    A.play('travel');
    if (!(await tw(tok, 4200, p => {
      W.setTrail(TRAIL, p);
      const d = p * TRAIL_LEN;
      let n = 0; for (let k = 0; k < 10; k++) if (TRAIL_CUM[STOPF[Math.min(k + 1, STOPF.length - 1)]] <= d + 1 || (k >= 8 && p >= 0.999)) n = k + 1;
      if (n > shown) { for (let k = shown; k < n; k++) chipShown[k] = true; shown = n; A.play('tick'); placeOverlays(); }
    }, t => t))) return;
    chipShown.fill(true); W.setTrail(TRAIL, 1);
    phasesOn = true; placeOverlays();
    A.play('xray');
    await sleep(tok, 800);
    renderPanel({ k: 'outro' }); openPanel();
    await camTo(frameOver(area(true)), 900, tok);
    focusPanel();
  }
  async function transition(from, to, tok) {
    if (from.k === 'intro' && to.k === 'intro') { renderPanel(to); focusPanel(); return; }
    if (from.k === 'intro' && to.k === 'hot') {
      closePanel(); phasesOn = false; placeOverlays();
      dotVis = true; setDotPos(YOU[0][0], YOU[0][1]);
      A.play('travel');
      if (!(await camTo(frame(ST[0].focus, area(false), capOf(0)), null, tok))) return;
      showHot(0); return;
    }
    if (from.k === 'hot' && to.k === 'page') {
      renderPanel(to); openPanel(); focusPanel();
      await camTo(frame(ST[to.i].focus, area(true), capOf(to.i)), 900, tok); return;
    }
    if (from.k === 'page' && to.k === 'cu') {
      renderPanel(to); focusPanel();
      if (sheet) await camTo(frame(ST[to.i].focus, area(true), capOf(to.i)), 700, tok);
      return;
    }
    if (from.k === 'cu') {
      await conseq(from.i, tok);
      if (tok.dead) return;
      applyWorld(from.i + 1, false, false);
      if (to.k === 'hot') {
        if (!(await camTo(frame(ST[to.i].focus, area(false), capOf(to.i)), 1000, tok))) return;
        showHot(to.i);
      } else if (to.k === 'mid') {
        renderPanel(to); openPanel(); focusPanel();
        await camTo(frame(ST[to.i].focus, area(true), capOf(to.i)), 1000, tok);
      } else await outroSeq(tok);
      return;
    }
    if (from.k === 'mid' && to.k === 'hot') {
      closePanel();
      if (!(await camTo(frame(ST[to.i].focus, area(false), capOf(to.i)), 900, tok))) return;
      showHot(to.i);
    }
  }
  async function goTo(n, mode) {
    n = clamp(n, 0, STEPS.length - 1);
    flowTok.dead = true; const tok = flowTok = newTok();
    const prev = cur; cur = n; const step = STEPS[n];
    updateDots(); A.setPhase(phaseOf(step)); hideHot();
    if (mode === 'anim' && n === prev + 1) {
      busy = true;
      await transition(STEPS[prev], step, tok);
      if (!tok.dead) busy = false;
      return;
    }
    busy = false;
    applyWorld(doneOf(step), step.k === 'intro', step.k === 'outro');
    phasesOn = step.k === 'intro' || step.k === 'outro';
    if (step.k === 'hot') {
      closePanel();
      if (!(await camTo(frame(ST[step.i].focus, area(false), capOf(step.i)), RM ? 0 : 700, tok))) return;
      showHot(step.i);
    } else {
      renderPanel(step); openPanel();
      const ar = area(true);
      const tgt = (step.k === 'intro' || step.k === 'outro') ? frameOver(ar) : frame(ST[step.i].focus, ar, capOf(step.i));
      focusPanel();
      await camTo(tgt, RM ? 0 : 700, tok);
    }
  }
  function next() {
    A.ensure();
    if (busy) { goTo(cur, 'jump'); return; }
    if (STEPS[cur].k === 'outro') { goTo(0, 'jump'); return; }
    goTo(cur + 1, 'anim');
  }
  function back() { A.ensure(); if (cur > 0) goTo(cur - 1, 'jump'); }
  $('pnext').addEventListener('click', next);
  $('pback').addEventListener('click', back);

  // ---------- traka ----------
  const dotsEl = $('dots'), dotBtns = [];
  function mkDot(label, stepIdx, parent) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'dot'; b.setAttribute('aria-label', label);
    b.addEventListener('click', () => { A.ensure(); goTo(stepIdx, 'jump'); });
    parent.appendChild(b); dotBtns.push({ b, stepIdx }); return b;
  }
  {
    const g0 = document.createElement('div'); g0.className = 'dgroup'; g0.setAttribute('role', 'group'); g0.setAttribute('aria-label', 'Uvod');
    g0.innerHTML = '<span class="gname">Uvod</span>'; mkDot('Uvod', 0, g0); dotsEl.appendChild(g0);
    K.PHASES.forEach((ph, pi) => {
      const g = document.createElement('div'); g.className = 'dgroup'; g.setAttribute('role', 'group'); g.setAttribute('aria-label', ph.name);
      g.innerHTML = `<span class="gname">${ph.name}</span>`;
      ST.forEach((s, i) => { if (s.phase === pi) mkDot(`Stanica ${i + 1}: ${s.q}`, STEPS.findIndex(q => q.k === 'hot' && q.i === i), g); });
      dotsEl.appendChild(g);
    });
    const g9 = document.createElement('div'); g9.className = 'dgroup'; g9.setAttribute('role', 'group'); g9.setAttribute('aria-label', 'Kraj');
    g9.innerHTML = '<span class="gname">Kraj</span>'; mkDot('Kraj puta', STEPS.length - 1, g9); dotsEl.appendChild(g9);
  }
  function updateDots() {
    const s = STEPS[cur], d = doneOf(s);
    dotBtns.forEach(({ b, stepIdx }, j) => {
      const t = STEPS[stepIdx];
      const isCur = (t.k === 'intro' && s.k === 'intro') || (t.k === 'outro' && s.k === 'outro') || (t.k === 'hot' && (s.k === 'hot' || s.k === 'page' || s.k === 'cu' || s.k === 'mid') && s.i === t.i);
      const done = t.k === 'hot' ? t.i < d : (t.k === 'intro' ? s.k !== 'intro' : false);
      b.classList.toggle('cur', isCur); b.classList.toggle('done', done && !isCur);
      if (isCur) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    });
  }

  // zvuk
  const tS = $('tSound');
  const syncSound = () => { tS.setAttribute('aria-pressed', A.isOn() ? 'true' : 'false'); tS.setAttribute('aria-label', A.isOn() ? 'Zvuk je uključen' : 'Zvuk je isključen'); };
  tS.addEventListener('click', () => { A.ensure(); A.setOn(!A.isOn()); syncSound(); });
  syncSound();
  $('tRestart').addEventListener('click', () => { A.ensure(); goTo(0, 'jump'); });
  // ceo ekran
  const tF = $('tFull');
  function toggleFS() {
    const d = document, el = d.documentElement;
    try {
      if (!(d.fullscreenElement || d.webkitFullscreenElement)) {
        const r = (el.requestFullscreen || el.webkitRequestFullscreen || (() => null)).call(el);
        if (r && r.catch) r.catch(() => { /* nije dozvoljeno ovde */ });
      } else {
        const r = (d.exitFullscreen || d.webkitExitFullscreen || (() => null)).call(d);
        if (r && r.catch) r.catch(() => { /* ništa */ });
      }
    } catch (e) { /* nije dozvoljeno ovde */ }
  }
  tF.addEventListener('click', toggleFS);
  const fsSync = () => { const on = !!(document.fullscreenElement || document.webkitFullscreenElement); tF.querySelector('.tl').textContent = on ? 'Izađi' : 'Ceo ekran'; tF.setAttribute('aria-label', on ? 'Izađi iz celog ekrana' : 'Ceo ekran'); };
  document.addEventListener('fullscreenchange', fsSync); document.addEventListener('webkitfullscreenchange', fsSync);
  // mali rečnik
  const gl = $('gloss'), tG = $('tGloss');
  function buildGloss() {
    const s = STEPS[cur];
    const upto = s.k === 'intro' ? -1 : s.k === 'outro' ? 9 : ((s.k === 'hot' || s.k === 'mid') ? s.i - 1 : s.i);
    let h = '<button class="tool gx" type="button" id="gClose" aria-label="Zatvori mali rečnik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
    h += '<h2>Mali rečnik</h2><p class="lead">Pojmovi se upisuju kad ih priča uvede.</p><dl>';
    K.INTRO.forEach(d => (d.terms || []).forEach(t => { h += `<dt>${t.t}<span class="st">uvod</span></dt><dd>${t.d}</dd>`; }));
    let hidden = 0;
    ST.forEach((st, i) => st.terms.forEach(t => { if (i <= upto) h += `<dt>${t.t}<span class="st">${i + 1}. stanica</span></dt><dd>${t.d}</dd>`; else hidden++; }));
    h += '</dl>';
    if (hidden) h += `<p class="lead" style="margin-top:10px">Još ${hidden} pojmova čeka na putu.</p>`;
    h += '<h3>Pojednostavljenja</h3><ul>';
    K.NOTES_GENERAL.forEach(n => { h += `<li>${n}</li>`; });
    ST.forEach((st, i) => { h += `<li><b>${st.chip}.</b> ${st.note}</li>`; });
    h += '</ul><h3>Izvori</h3><ul>';
    K.SOURCES.forEach(x => { h += `<li><a href="${x.u}" target="_blank" rel="noopener">${x.t}</a></li>`; });
    h += '</ul><p class="lead" style="margin-top:12px">Teme prate program nastave i učenja matematike za 5. i 6. razred, po kome su pisani odobreni udžbenici.</p>';
    gl.innerHTML = h;
    $('gClose').addEventListener('click', closeGloss);
  }
  function openGloss() { buildGloss(); gl.hidden = false; tG.setAttribute('aria-expanded', 'true'); A.play('open'); try { $('gClose').focus({ preventScroll: true }); } catch (e) { /* bez fokusa */ } }
  function closeGloss() { if (gl.hidden) return; gl.hidden = true; tG.setAttribute('aria-expanded', 'false'); A.play('close'); tG.focus({ preventScroll: true }); }
  tG.addEventListener('click', () => { A.ensure(); gl.hidden ? openGloss() : closeGloss(); });
  document.addEventListener('pointerdown', e => { if (!gl.hidden && !gl.contains(e.target) && !tG.contains(e.target)) closeGloss(); });

  // ---------- tastatura i daljinski ----------
  document.addEventListener('keydown', e => {
    if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    const t = e.target, tag = t.tagName, isRange = t.type === 'range';
    const isBtn = tag === 'BUTTON' || tag === 'A' || tag === 'INPUT' || (t.getAttribute && t.getAttribute('role') === 'button');
    if (e.key === 'Escape') { if (!gl.hidden) { e.preventDefault(); closeGloss(); } return; }
    if (e.key === 'PageDown' || (e.key === 'ArrowRight' && !isRange) || e.key === 'MediaTrackNext') { e.preventDefault(); next(); return; }
    if (e.key === 'PageUp' || (e.key === 'ArrowLeft' && !isRange) || e.key === 'MediaTrackPrevious') { e.preventDefault(); back(); return; }
    if ((e.key === ' ' || e.key === 'Enter') && !isBtn) { e.preventDefault(); next(); return; }
    if ((e.key === 'f' || e.key === 'F') && tag !== 'INPUT') { toggleFS(); return; }
    if ((e.key === 'm' || e.key === 'M') && tag !== 'INPUT') { A.ensure(); A.setOn(!A.isOn()); syncSound(); }
  });
  const unlock = () => A.ensure();
  document.addEventListener('pointerdown', unlock, { passive: true });

  // ---------- početak ----------
  layout();
  applyWorld(0, true, false);
  renderPanel(STEPS[0]);
  panel.classList.add('open');
  phasesOn = true;
  setCam(frameOver(area(true)));
  updateDots();
  const ro = new ResizeObserver(() => {
    layout();
    const s = STEPS[cur];
    if (busy) return;
    const open = panel.classList.contains('open');
    const ar = area(open);
    const tgt = (s.k === 'intro' || s.k === 'outro') ? frameOver(ar) : frame(ST[s.i].focus, ar, capOf(s.i));
    setCam(tgt);
  });
  ro.observe(stage);
  // za proveru u pregledaču
  window.__kostur = { goTo: (n, m) => goTo(n, m || 'jump'), next, back, steps: STEPS, state: () => ({ cur, busy, step: STEPS[cur], doneK, cam: Object.assign({}, cam) }) };
})();

</script>
